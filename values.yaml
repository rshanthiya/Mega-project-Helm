mysql:
  name: mysql
  secretName: mysql-secret
  configName: mysql-config
  pvcName: mysql-pvc
  serviceName: mysql-service

  image: "mysql-8"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"
  database: "bankappdb"
  MYSQL_ROOT_PASSWORD: "Test@123"
  storageSize: 5Gi
  service:
    type: clusterIP
    port: 3306



bankapp:

  name: bankapp
  serviceName: bankapp-service

  replicas: 1
  image: "adijaiswal/bankapp:latest"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: LoadBalancer
    port: 80

storageClass:
  name: "ebs-sc"
  type: "gp3"
  fsType: "ext4"
  reclaimPolicy: "Retain"
  volumeBindingMode: "WaitForFirstConsumer"






  

 
